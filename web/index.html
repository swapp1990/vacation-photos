<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacation Photos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 48px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .emoji {
      font-size: 64px;
      margin-bottom: 24px;
    }
    h1 {
      color: #1E293B;
      font-size: 28px;
      margin-bottom: 16px;
    }
    p {
      color: #64748B;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .app-store-button {
      display: inline-block;
      background: #000;
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .app-store-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .features {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #E2E8F0;
      text-align: left;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: #475569;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🌴</div>
    <h1>Vacation Photos</h1>
    <p>Your trips are hiding in your camera roll. This app magically finds and organizes them.</p>
    <a href="https://apps.apple.com/app/id6756803475" class="app-store-button">
      Download on App Store
    </a>
    <div class="features">
      <div class="feature">✨ Auto-finds vacation photos</div>
      <div class="feature">🗺️ Groups by location</div>
      <div class="feature">📤 Share with friends</div>
      <div class="feature">🔐 100% private - stays on device</div>
    </div>
  </div>
  <script>
  (function () {
    var ENDPOINT = 'https://analytics.swapp1990.org/api/events';
    var APP_ID = 'vacationphotos';
    var PROD_HOST = 'vacationphotos.swapp1990.org';
    var DEVICE_KEY = 'swapanalytics_device_id';

    function uuid() {
      try {
        if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
          return crypto.randomUUID();
        }
      } catch (e) {}
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = (Math.random() * 16) | 0;
        var v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function getDeviceId() {
      try {
        var id = localStorage.getItem(DEVICE_KEY);
        if (!id) {
          id = uuid();
          localStorage.setItem(DEVICE_KEY, id);
        }
        return id;
      } catch (e) {
        return uuid();
      }
    }

    function environment() {
      try {
        return location.hostname === PROD_HOST ? 'production' : 'development';
      } catch (e) {
        return 'development';
      }
    }

    function utmMeta() {
      var out = {};
      try {
        var params = new URLSearchParams(location.search);
        ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach(function (k) {
          var v = params.get(k);
          if (v) out[k] = v;
        });
      } catch (e) {}
      return out;
    }

    function send(eventName, metadata) {
      try {
        var payload = {
          appId: APP_ID,
          eventName: eventName,
          environment: environment(),
          metadata: metadata || {},
          deviceId: getDeviceId()
        };
        var body = JSON.stringify(payload);
        if (typeof navigator !== 'undefined' && typeof navigator.sendBeacon === 'function') {
          var blob = new Blob([body], { type: 'application/json' });
          if (navigator.sendBeacon(ENDPOINT, blob)) return;
        }
        if (typeof fetch === 'function') {
          fetch(ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: body,
            keepalive: true
          }).catch(function () {});
        }
      } catch (e) {
        /* analytics must never break the page */
      }
    }

    try {
      var meta = {
        path: location.pathname + location.search,
        referrer: document.referrer || null
      };
      var utm = utmMeta();
      for (var k in utm) {
        if (Object.prototype.hasOwnProperty.call(utm, k)) meta[k] = utm[k];
      }
      send('page_view', meta);
    } catch (e) {}
  })();
  </script>
</body>
</html>
